name: Python package

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install structural-check and build tools
        run: python -m pip install pytest flake8 ruff build twine
      - name: Fatal lint
        run: |
          flake8 src cicd --count --select E9,F63,F7,F82 --show-source --statistics
          ruff check src cicd
      - name: Reviewer autochecks
        run: python -m pytest cicd/reviewer_autochecks
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Pre-release autochecks
        if: >-
          github.event_name == 'push' ||
          (github.base_ref == 'main' && github.head_ref == 'develop')
        run: python cicd/pre_release_autochecks/check_all_invariants_covered.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[tests]'
          python -m pip check
      - name: Verify wheel outside checkout
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          wheel_target="$(mktemp -d)"
          python -m build --outdir "$artifact_dir"
          python -m twine check "$artifact_dir"/*
          python -m pip install --no-deps --target "$wheel_target" "$artifact_dir"/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$wheel_target" python -c 'import os; from pathlib import Path; import bojaxns; from bojaxns import BayesianOptimisation, ParameterSpace; assert Path(bojaxns.__file__).resolve().is_relative_to(Path(os.environ["PYTHONPATH"]).resolve())'
      - name: Unit tests
        run: python -m pytest cicd/tests
      - name: System tests
        if: >-
          matrix.python-version == '3.14' &&
          (github.event_name == 'push' ||
          (github.base_ref == 'main' && github.head_ref == 'develop'))
        run: python -m pytest cicd/system_tests
